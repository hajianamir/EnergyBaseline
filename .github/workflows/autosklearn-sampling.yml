name: auto-sklearn stall sampling (temporary investigation)

# One hosted Linux machine stalled in auto-sklearn until the wall-clock budget on the first
# run of the isolated-engine workflow and later machines did not. This samples several fresh
# machines; a stall is reported with the worker's thread stacks and process states.
on:
  push:
    paths:
      - '.github/workflows/autosklearn-sampling.yml'

permissions:
  contents: read

jobs:
  sample:
    name: Sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - id: py39
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          update-environment: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Machine facts
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-400
          uname -r
          cat /etc/hosts
          free -m | head -2
      - name: Provision auto-sklearn
        run: |
          home="$RUNNER_TEMP/eb-provisioned"
          mkdir -p "$home/model-assets"
          echo "EB_HOME=$home" >> "$GITHUB_ENV"
          echo "EB_PROVISIONED_HOME=$home" >> "$GITHUB_ENV"
          EB_HOME="$home" python -m energybaseline.cli engines install autosklearn --python "${{ steps.py39.outputs.python-path }}"
      - name: Six real auto-sklearn searches
        run: |
          for round in 1 2 3; do
            python -m pytest -q provisioned_tests -p no:cacheprovider -k autosklearn --durations=5
          done
      - name: Diagnostics (on failure)
        if: failure()
        run: python scripts/evidence/isolated_diagnose.py autosklearn
