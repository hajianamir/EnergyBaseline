name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Phase 0 Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux headless Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install hashed lockfile dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock

      - name: Ruff lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pyflakes check
        run: |
          python -m pyflakes energybaseline

      - name: Architecture and integrity gates
        run: |
          python scripts/gates/guard_web_free.py
          python scripts/gates/guard_env_readers.py
          python scripts/gates/guard_tests_integrity.py
          python scripts/gen_matrix.py --check

      - name: Gate negative tests
        run: |
          python -m pytest -q tests/gates

      - name: Core test suite and coverage gate (S5 >= 60%)
        run: |
          python -m pytest -q --cov=energybaseline/core --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=60

      - name: GUI QApplication smoke test (pytest-qt)
        run: |
          python -m pytest -q tests/gui -p no:cacheprovider

      - name: Self-signed Authenticode signing smoke test (D1=B, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/sign/sign_artifacts.ps1 -SelfTest

      - name: Vulnerability audit (pip-audit)
        run: |
          pip-audit -r requirements.lock

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements.lock --pyproject pyproject.toml --output-reproducible -o sbom.json

      - name: Upload SBOM, coverage, and evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            sbom.json
            coverage.xml
            artifacts/**
