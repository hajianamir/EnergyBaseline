name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Phase 6 Gate G6 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux headless Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Set up Python 3.11 (3.11.9 on Windows; 3.11.18 on Ubuntu 26.04)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.os == 'windows-latest' && '3.11.9' || '3.11.18' }}
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install hashed lockfile dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock

      - name: Ruff lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pyflakes check
        run: |
          python -m pyflakes energybaseline

      - name: Gate G1 architecture, integrity, and traceability checks
        run: |
          python scripts/gates/guard_web_free.py
          python scripts/gates/guard_env_readers.py
          python scripts/gates/guard_tests_integrity.py
          python scripts/gates/guard_no_qthread_compute.py
          python -c "assert 'DATABASE_URL' not in open('energybaseline/launcher.py', encoding='utf-8').read()"
          python scripts/gen_matrix.py --check

      - name: Gate G1 Alembic reversible migration cycle
        run: |
          python -c "import os, subprocess, sys, tempfile; d = tempfile.mkdtemp(prefix='eb_ci_alembic_'); env = {**os.environ, 'EB_HOME': d}; [subprocess.check_call([sys.executable, '-m', 'alembic', *cmd], env=env) for cmd in (('upgrade', 'head'), ('downgrade', 'base'), ('upgrade', 'head'))]"

      - name: Gate G1 unit tests (gates + DB config)
        run: |
          python -m pytest -q --junitxml=pytest-gates.xml tests/gates/ tests/test_config_db.py

      - name: Gate G4 independent sub-gates (G4a, G4b, G4c) and R reference staleness gate
        run: |
          python -m pytest -q tests/test_reference_staleness.py
          python -m pytest -q tests/gates/test_phase4_g4a_t1_t4.py
          python -m pytest -q tests/gates/test_phase4_g4b_t5_t9.py
          python -m pytest -q tests/gates/test_phase4_g4c_t10_t14.py

      - name: Gate G5 F1..F10 models, clustering isolation, and 1M-row benchmark
        run: |
          python -m pytest -q --junitxml=pytest-g5.xml tests/gates/test_phase5_f1_f10_models.py tests/gates/test_phase5_mining_isolation_and_perf.py
          python scripts/benchmarks/bench_1m.py --out artifacts/phase5/ci_bench_1m.json

      - name: Gate G6 validation, portfolio, 13-criteria scoring, Top-5, and baseline lock
        run: |
          python -m pytest -q --junitxml=pytest-g6.xml tests/gates/test_phase6_validation_and_portfolio.py tests/gates/test_phase6_scoring_top5_and_lock.py

      - name: Full test suite and coverage gate (S5 >= 60%, Core + TestsCatalog + Mining + Models + Validation + Scoring + Lock >= 80%)
        run: |
          python -m pytest -q --junitxml=pytest-core.xml --cov=energybaseline/core --cov=energybaseline/tests_catalog --cov=energybaseline/mining --cov=energybaseline/models --cov=energybaseline/scoring --cov=energybaseline/validation --cov=energybaseline/lock --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=60
          python -m coverage report --fail-under=80

      - name: Emit pytest failure annotations on error
        if: failure()
        run: |
          python -c "import glob, subprocess, sys; [subprocess.call([sys.executable, 'scripts/ci_junit_annotations.py', f]) for f in sorted(glob.glob('pytest-*.xml'))]"

      - name: GUI smoke, Phase 1..5 shell, schema, VSG/TCP & 1M table tests (GUI >= 56%)
        run: |
          python -m pytest -q tests/gui -p no:cacheprovider --cov=energybaseline/gui --cov-report=term --cov-fail-under=56

      - name: Phase 1 Windows packaging & runtime evidence (CI, non-normative per D2)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $py = (Get-Command python).Source
            pwsh -NoProfile -File scripts/evidence/installer_smoke.ps1 -Profile lite -PythonExe $py
            if ($LASTEXITCODE -ne 0) { throw "installer_smoke.ps1 exited with $LASTEXITCODE" }
            pwsh -NoProfile -File scripts/evidence/lif_orphans.ps1 -PythonExe $py
            if ($LASTEXITCODE -ne 0) { throw "lif_orphans.ps1 exited with $LASTEXITCODE" }
            pwsh -NoProfile -File scripts/evidence/startup_time.ps1 -PythonExe $py
            if ($LASTEXITCODE -ne 0) { throw "startup_time.ps1 exited with $LASTEXITCODE" }
            pwsh -NoProfile -File scripts/evidence/dpi_matrix.ps1 -PythonExe $py
            if ($LASTEXITCODE -ne 0) { throw "dpi_matrix.ps1 exited with $LASTEXITCODE" }
          }
          catch {
            Write-Output "::error title=Phase1WindowsEvidence::$($_.Exception.Message) at $($_.InvocationInfo.ScriptName):$($_.InvocationInfo.ScriptLineNumber)"
            throw
          }
          finally {
            if (Test-Path artifacts\phase1\evidence) {
              Get-ChildItem artifacts\phase1\evidence\*.json | ForEach-Object {
                $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
                $compact = (Get-Content $_.FullName -Raw | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 8)
                Write-Output "::notice title=$($_.Name) (sha256=$h)::$compact"
              }
            }
          }

      - name: Self-signed Authenticode signing smoke test (D1=B, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/sign/sign_artifacts.ps1 -SelfTest

      - name: Vulnerability audit (pip-audit)
        run: |
          pip-audit -r requirements.lock

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements.lock --pyproject pyproject.toml --output-reproducible -o sbom.json

      - name: Upload SBOM, coverage, and Phase 1 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            sbom.json
            coverage.xml
            pytest-core.xml
            artifacts/**
