name: Native external backend diagnostics

on:
  push:
    paths:
      - 'energybaseline/**'
      - 'requirements*'
      - 'scripts/build_exe.py'
      - 'scripts/evidence/external_engines.py'
      - '.github/workflows/external-backends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-diagnostics:
    name: Real console-bundle backend diagnostics (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the unchanged hash-locked runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python scripts/verify_runtime.py
          python -m pip check
      - name: Build the actual lite bundle with a diagnostic console bootloader
        run: |
          python scripts/build_exe.py --profile lite --console --dist-dir dist/diagnostic
      - name: Execute actual external and pretrained backends on synthetic fixtures
        run: |
          python scripts/evidence/external_engines.py --executable dist/diagnostic/EnergyBaseline/EnergyBaseline.exe --diagnostics --out artifacts/capabilities/external-stage5/ci-console-engines.json
      - name: Publish diagnostics without substituting for windowed acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-backend-console-diagnostics
          path: |
            artifacts/capabilities/external-stage5/ci-console-engines.json
            build/pyinstaller/EnergyBaseline/warn-EnergyBaseline.txt
          if-no-files-found: warn
