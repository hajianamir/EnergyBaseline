name: Isolated engines and pretrained models

on:
  push:
    paths:
      - 'energybaseline/**'
      - 'provisioned_tests/**'
      - 'examples/isolated/**'
      - 'requirements*'
      - 'scripts/build_exe.py'
      - 'scripts/evidence/isolated_engines.py'
      - '.github/workflows/isolated-engines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    name: Provision and execute real engines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # auto-sklearn 0.15.0 needs CPython 3.9, which the runner images provide up to Ubuntu 24.04.
        os: [ubuntu-24.04, windows-latest]

    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space for two PyTorch environments
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux headless Qt runtime libraries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Set up the CPython 3.9 base interpreter for the auto-sklearn runtime
        if: matrix.os == 'ubuntu-24.04'
        id: py39
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          update-environment: false

      - name: Set up the application interpreter
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the unchanged hash-locked application runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python scripts/verify_runtime.py
          python -m pip check

      - name: Choose the application home that receives runtimes and model assets
        run: |
          home="$(python -c "import os, pathlib; print(pathlib.Path(os.environ['RUNNER_TEMP'], 'eb-provisioned').as_posix())")"
          echo "EB_HOME=$home" >> "$GITHUB_ENV"
          echo "EB_PROVISIONED_HOME=$home" >> "$GITHUB_ENV"

      - name: Provision TPOT, H2O, AutoGluon and Chronos from their hash locks
        run: |
          for engine in tpot h2o autogluon chronos; do
            python -m energybaseline.cli engines install "$engine"
          done

      - name: Provision auto-sklearn on CPython 3.9 (POSIX only upstream)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m energybaseline.cli engines install autosklearn --python "${{ steps.py39.outputs.python-path }}"

      - name: Provision pretrained weights from their fixed origins with hash verification
        run: |
          python -m energybaseline.cli assets install chronos-bolt-tiny
          python -m energybaseline.cli assets install ghostnet-imagenet
          python -m energybaseline.cli engines status
          python -m energybaseline.cli assets status
          df -h . || true

      - name: Real execution, leakage, determinism, tamper, timeout and parent-death tests
        run: |
          python -m pytest -q provisioned_tests -p no:cacheprovider --junitxml=pytest-provisioned.xml --durations=20

      - name: Real command-line executions with semantic oracles
        run: |
          python scripts/evidence/isolated_engines.py --out "artifacts/capabilities/isolated-stage7/ci-python-${{ runner.os }}.json"

      - name: Build the full windowed Windows bundle
        if: matrix.os == 'windows-latest'
        run: |
          python scripts/build_exe.py --profile full --dist-dir dist/isolated

      - name: Real frozen Windows executions through the provisioned runtimes
        if: matrix.os == 'windows-latest'
        run: |
          python scripts/evidence/isolated_engines.py --executable dist/isolated/EnergyBaseline/EnergyBaseline.exe --out artifacts/capabilities/isolated-stage7/ci-frozen-Windows.json

      - name: Emit pytest failure annotations on error
        if: failure()
        run: |
          python scripts/ci_junit_annotations.py pytest-provisioned.xml || true

      - name: Engine diagnostics for the repository's synthetic example (on failure)
        if: failure()
        run: |
          python scripts/evidence/isolated_diagnose.py

      - name: Publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-engine-receipts-${{ matrix.os }}
          path: |
            artifacts/capabilities/isolated-stage7/ci-*.json
            pytest-provisioned.xml
          if-no-files-found: warn
