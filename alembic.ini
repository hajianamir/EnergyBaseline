# Alembic configuration. The database URL is NOT set here: alembic/env.py asks
# energybaseline.config.settings.get_database_url() (SQLite fallback built in).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
